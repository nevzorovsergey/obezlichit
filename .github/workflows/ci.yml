name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: SHA-256 автономной страницы
        run: cat dist/obezlichit.html.sha256
      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/v')
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release create "$GITHUB_REF_NAME" dist/obezlichit.html dist/obezlichit.html.sha256 --title "$GITHUB_REF_NAME" --notes "Автономная страница одним файлом. SHA-256 — в obezlichit.html.sha256; соберите сами (npm ci && npm run build) и сравните."
